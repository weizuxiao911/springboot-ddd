server:
  port: 8080
spring:
  application:
    name: springboot-ddd
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:3306/${DB_NAME:springboot_ddd}?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20 # 最大连接数
      minimum-idle: 5 # 最小空闲连接数
      connection-timeout: 30000 # 连接超时时间（ms）
      idle-timeout: 600000 # 空闲连接超时时间（ms）
      max-lifetime: 1800000 # 连接最大存活时间（ms）
  jpa:
    database-platform: org.hibernate.dialect.MySQL8Dialect
    show-sql: true
    properties:
      hibernate:
        formatSql: true
        jdbc:
          timeZone: Asia/Shanghai
    open-in-view: false

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:9092}
    consumer:
      group-id: ${spring.application.name}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
      # trusted-packages 收紧到具体包,避免反序列化 RCE(* 等同于打开)
      properties:
        spring.json.trusted.packages: "top.archaiharness.framework.domain.event"
        max-poll-interval-ms: 300000
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    listener:
      ack-mode: MANUAL_IMMEDIATE
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms
logging:
  level:
    org.hibernate.SQL: info
    org.hibernate.type.descriptor.sql: warn

management:
  endpoints:
    web:
      exposure:
        include: "health,info,metrics"
  endpoint:
    health:
      probes:
        enabled: true

# OpenAPI 配置: knife4j 已包含 springdoc(4.x 基于 springdoc 2.x),无需重复配置
knife4j:
  enable: true
  setting:
    language: zh_CN

# 服务配置
user-service:
  url: ${USER_SERVICE_URL:http://127.0.0.1:8001}

lab-service:
  url: ${LAB_SERVICE_URL:http://127.0.0.1:8002}
